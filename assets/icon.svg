<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f2533"/>
      <stop offset="100%" stop-color="#0f1218"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12"/>

  <!-- Subtle Radiating rays -->
  <g stroke="#f59e0b" stroke-opacity="0.18" stroke-width="2">
    <line x1="256" y1="40" x2="256" y2="90" />
    <line x1="256" y1="422" x2="256" y2="472" />
    <line x1="40" y1="256" x2="90" y2="256" />
    <line x1="422" y1="256" x2="472" y2="256" />
    <line x1="103" y1="103" x2="138" y2="138" />
    <line x1="374" y1="374" x2="409" y2="409" />
    <line x1="103" y1="409" x2="138" y2="374" />
    <line x1="374" y1="138" x2="409" y2="103" />
  </g>

  <!-- Lotus Petals Outer -->
  <path d="M256,120 C220,190 170,230 140,280 C180,300 230,290 256,330 C282,290 332,300 372,280 C342,230 292,190 256,120 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  
  <!-- Left Petal -->
  <path d="M140,280 C110,240 100,190 130,160 C160,200 180,240 210,270 C180,275 155,278 140,280 Z" fill="#f59e0b" opacity="0.85"/>

  <!-- Right Petal -->
  <path d="M372,280 C402,240 412,190 382,160 C352,200 332,240 302,270 C332,275 357,278 372,280 Z" fill="#f59e0b" opacity="0.85"/>

  <!-- Central Flame / Tilak symbol -->
  <path d="M256,160 C240,200 235,230 235,260 C235,285 244,300 256,300 C268,300 277,285 277,260 C277,230 272,200 256,160 Z" fill="#ffffff" opacity="0.95"/>

  <!-- Base Petals Curve -->
  <path d="M150,330 C190,360 322,360 362,330 C340,380 172,380 150,330 Z" fill="url(#goldGrad)"/>

  <!-- Tilak U-Shape Base -->
  <path d="M246,310 L266,310 L256,330 Z" fill="#ffffff"/>
</svg>
